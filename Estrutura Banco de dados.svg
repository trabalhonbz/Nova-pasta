<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.1 468" width="595.1" height="468">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans Mono', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }</style>
  <defs>
    <style>text { font-family: "Google Sans Mono", monospace; font-size: 13px; dominant-baseline: central; white-space: pre; }
.outer-box { fill: color-mix(in srgb, var(--fg) 6%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.75px; }
.rect-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.stadium-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.hex-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.diamond-box { fill: color-mix(in srgb, var(--fg) 9%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.header-text { font-size: 14px; font-weight: 600; fill: var(--_text); }
.label-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.annotation-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.arrow-line, .bus-line { stroke: var(--_line); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.divider-line { stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.0px; stroke-opacity: 0.75; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
  </defs>
  <line x1="27.75" y1="47" x2="44.75" y2="47" class="bus-line"/>
  <line x1="27.75" y1="69" x2="44.75" y2="69" class="bus-line"/>
  <line x1="27.75" y1="91" x2="44.75" y2="91" class="bus-line"/>
  <line x1="27.75" y1="157" x2="44.75" y2="157" class="bus-line"/>
  <line x1="27.75" y1="179" x2="44.75" y2="179" class="bus-line"/>
  <line x1="27.75" y1="201" x2="44.75" y2="201" class="bus-line"/>
  <line x1="27.75" y1="223" x2="44.75" y2="223" class="bus-line"/>
  <line x1="27.75" y1="245" x2="44.75" y2="245" class="bus-line"/>
  <line x1="27.75" y1="311" x2="44.75" y2="311" class="bus-line"/>
  <line x1="27.75" y1="333" x2="44.75" y2="333" class="bus-line"/>
  <line x1="27.75" y1="355" x2="44.75" y2="355" class="bus-line"/>
  <line x1="27.75" y1="377" x2="44.75" y2="377" class="bus-line"/>
  <line x1="27.75" y1="399" x2="44.75" y2="399" class="bus-line"/>
  <line x1="27.75" y1="421" x2="44.75" y2="421" class="bus-line"/>
  <line x1="27.75" y1="443" x2="44.75" y2="443" class="bus-line"/>
  <line x1="27.75" y1="47" x2="27.75" y2="91" class="bus-line"/>
  <line x1="27.75" y1="157" x2="27.75" y2="245" class="bus-line"/>
  <line x1="27.75" y1="311" x2="27.75" y2="443" class="bus-line"/>
  <text x="15" y="25" class="annotation-text" text-anchor="start" dominant-baseline="central">TABELA: usuarios (Gerenciado pelo sistema de autenticação nativo)</text>
  <text x="57.5" y="47" class="annotation-text" text-anchor="start" dominant-baseline="central">id (Chave Primária única)</text>
  <text x="57.5" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">email (Texto)</text>
  <text x="57.5" y="91" class="annotation-text" text-anchor="start" dominant-baseline="central">nivel_acesso ('admin', 'diretoria', 'engenheiro')</text>
  <text x="15" y="135" class="annotation-text" text-anchor="start" dominant-baseline="central">TABELA: obras_relatorios</text>
  <text x="57.5" y="157" class="annotation-text" text-anchor="start" dominant-baseline="central">id (Chave Primária)</text>
  <text x="57.5" y="179" class="annotation-text" text-anchor="start" dominant-baseline="central">nome_obra (Texto)</text>
  <text x="57.5" y="201" class="annotation-text" text-anchor="start" dominant-baseline="central">data_criacao (Timestamp automático)</text>
  <text x="57.5" y="223" class="annotation-text" text-anchor="start" dominant-baseline="central">url_planta_arquivo (Link do PDF/JPG armazenado no Storage gratuito)</text>
  <text x="57.5" y="245" class="annotation-text" text-anchor="start" dominant-baseline="central">criado_por (Id do Engenheiro que enviou)</text>
  <text x="15" y="289" class="annotation-text" text-anchor="start" dominant-baseline="central">TABELA: marcacoes_planta</text>
  <text x="57.5" y="311" class="annotation-text" text-anchor="start" dominant-baseline="central">id (Chave Primária)</text>
  <text x="57.5" y="333" class="annotation-text" text-anchor="start" dominant-baseline="central">relatorio_id (Chave Estrangeira ligada à tabela obras_relatorios)</text>
  <text x="57.5" y="355" class="annotation-text" text-anchor="start" dominant-baseline="central">coordenada_x (Percentual geométrico da marcação)</text>
  <text x="57.5" y="377" class="annotation-text" text-anchor="start" dominant-baseline="central">coordenada_y (Percentual geométrico da marcação)</text>
  <text x="57.5" y="399" class="annotation-text" text-anchor="start" dominant-baseline="central">status ('finalizada', 'liberada', 'executando', 'nao-liberada')</text>
  <text x="57.5" y="421" class="annotation-text" text-anchor="start" dominant-baseline="central">nota_localizacao (Texto digitado pelo engenheiro)</text>
  <text x="57.5" y="443" class="annotation-text" text-anchor="start" dominant-baseline="central">alterado_em (Data/Hora exata do registro)</text>
</svg>
